<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Квиз</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a1a; --surface: #12122a; --surface2: #1e1e3a; --border: #2a2a4a;
  --accent: #4f8ef7; --green: #27ae60; --red: #e74c3c;
  --text: #e8e8f0; --text-muted: #888aaa; --gold: #f1c40f; --radius: 12px;
}
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

.screen { display: none; position: fixed; inset: 0; overflow-y: auto; flex-direction: column; }
.screen.active { display: flex; }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: .55em 1.2em; border: none; border-radius: var(--radius);
  cursor: pointer; font-size: 1rem; font-weight: 600; transition: opacity .15s, transform .1s;
  text-decoration: none; white-space: nowrap; font-family: inherit;
}
.btn:hover { opacity: .85; } .btn:active { transform: scale(.97); }
.btn-primary  { background: var(--accent); color: #fff; }
.btn-secondary{ background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-ghost    { background: transparent; color: var(--text-muted); }
.btn-success  { background: var(--green); color: #fff; font-size: 1.4rem; padding: .6em 2em; }
.btn-danger   { background: var(--red);   color: #fff; font-size: 1.4rem; padding: .6em 2em; }
.btn-large    { font-size: 1.2rem; padding: .75em 2.5em; }
.btn-sm       { font-size: .85rem; padding: .35em .8em; }

/* SETUP */
#screen-setup { align-items: center; justify-content: flex-start; padding: 2rem 1rem 4rem; }
.setup-container { width: 100%; max-width: 680px; margin: 0 auto; }
.logo { font-size: 2.5rem; text-align: center; margin-bottom: 2rem; }
.setup-section { background: var(--surface); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.5rem; }
.setup-section h2 { font-size: .9rem; text-transform: uppercase; letter-spacing: .1em; color: var(--text-muted); margin-bottom: 1rem; }
.round-item { display: flex; align-items: center; gap: .5rem; background: var(--surface2); border-radius: 8px; padding: .6rem .8rem; margin-bottom: .5rem; }
.round-item .round-name { flex: 1; font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.round-order-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; }
.round-order-btn:hover { color: var(--text); }
.round-remove-btn { background: none; border: none; color: var(--red); cursor: pointer; font-size: 1.1rem; }
.team-item { display: flex; align-items: center; gap: .75rem; background: var(--surface2); border-radius: 8px; padding: .6rem .8rem; margin-bottom: .5rem; }
.team-color { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; cursor: pointer; }
.team-name-input { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: .35em .6em; font-size: 1rem; font-family: inherit; }
.team-remove-btn { background: none; border: none; color: var(--red); cursor: pointer; font-size: 1.1rem; }
#start-game-btn { width: 100%; margin-top: .5rem; }
.setup-hint { font-size: .8rem; color: var(--text-muted); margin-top: .5rem; }

/* BOARD */
#screen-board { display: none; flex-direction: column; }
#screen-board.active { display: flex; }
.board-header { display: flex; align-items: center; justify-content: space-between; padding: .75rem 1.5rem; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; gap: 1rem; flex-wrap: wrap; }
#scores-bar { display: flex; gap: 1rem; flex-wrap: wrap; flex: 1; }
.score-chip { display: flex; flex-direction: column; align-items: center; padding: .4rem .9rem; border-radius: 8px; min-width: 90px; }
.score-chip .team-name { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; opacity: .8; }
.score-chip .team-score { font-size: 1.5rem; font-weight: 700; }
.board-controls { display: flex; gap: .5rem; align-items: center; }
.round-label { color: var(--text-muted); font-size: .9rem; }
.board-grid { flex: 1; display: grid; overflow: auto; padding: 1rem 1.5rem 2rem; gap: 8px; align-content: start; }
.category-header { background: var(--accent); color: #fff; border-radius: 8px; padding: .6rem; text-align: center; font-weight: 700; font-size: 1rem; text-transform: uppercase; display: flex; align-items: center; justify-content: center; min-height: 60px; }
.question-cell { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; color: var(--gold); cursor: pointer; transition: background .15s, transform .1s; min-height: 70px; position: relative; flex-direction: column; gap: .2rem; }
.question-cell:hover { background: var(--surface2); transform: scale(1.03); }
.question-cell.used { background: var(--bg); color: var(--border); cursor: default; pointer-events: none; }
.cell-badge { font-size: .65rem; font-weight: 700; padding: .15em .5em; border-radius: 4px; text-transform: uppercase; letter-spacing: .05em; }
.badge-bag     { background: #9b59b6; color: #fff; }
.badge-auction { background: var(--gold); color: #000; }

/* QUESTION */
#screen-question { display: none; flex-direction: column; justify-content: space-between; padding: 1.5rem; }
#screen-question.active { display: flex; }
.question-layout { display: flex; flex-direction: column; gap: 1rem; height: 100%; }
.question-top { display: flex; align-items: center; justify-content: space-between; }
.question-value { font-size: 1.5rem; font-weight: 700; color: var(--gold); }
.question-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; text-align: center; }
.q-text { font-size: 2.2rem; font-weight: 600; line-height: 1.3; max-width: 900px; }
.q-cat-label { font-size: 1rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .1em; }
.q-media { max-width: 100%; max-height: 40vh; border-radius: 8px; }
.q-type-badge { font-size: 1.1rem; font-weight: 700; padding: .3em 1em; border-radius: 50px; margin-bottom: .5rem; }
.q-type-bag     { background: #9b59b6; color: #fff; }
.q-type-auction { background: var(--gold); color: #000; }

.buzz-display { text-align: center; animation: buzzIn .3s ease; }
@keyframes buzzIn { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.buzz-team { display: inline-block; padding: .6rem 2.5rem; border-radius: 50px; font-size: 2.5rem; font-weight: 900; color: #fff; }

.timer-row { display: flex; justify-content: center; }
.timer-circle { position: relative; width: 120px; height: 120px; }
.timer-circle svg { transform: rotate(-90deg); }
.timer-bg  { fill: none; stroke: var(--surface2); stroke-width: 8; }
.timer-arc { fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset .5s linear, stroke .3s; }
.timer-arc.warning { stroke: var(--gold); }
.timer-arc.danger  { stroke: var(--red); }
.timer-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 700; }
.question-controls { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }

/* ANSWER REVEAL */
.answer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: flex; align-items: center; justify-content: center; z-index: 100; }
.answer-box { background: var(--surface); border-radius: var(--radius); padding: 2.5rem; max-width: 700px; width: 90%; text-align: center; display: flex; flex-direction: column; gap: 1.2rem; }
.answer-box h2 { color: var(--accent); font-size: 1.5rem; text-transform: uppercase; }
.ans-text { font-size: 1.6rem; }

/* EVENT POPUP (+100 КОМАНДА!) */
.event-popup {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0);
  z-index: 300; text-align: center; pointer-events: none;
  transition: transform .25s cubic-bezier(.34,1.56,.64,1);
}
.event-popup.show { transform: translate(-50%,-50%) scale(1); }
.event-popup.hide { transform: translate(-50%,-50%) scale(0) translateY(-60px); transition: transform .4s ease-in, opacity .4s; opacity: 0; }
.event-popup-points { font-size: 5rem; font-weight: 900; line-height: 1; text-shadow: 0 4px 20px rgba(0,0,0,.5); }
.event-popup-name   { font-size: 2rem; font-weight: 700; margin-top: .3rem; }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; z-index: 200; }
.modal { background: var(--surface); border-radius: var(--radius); padding: 2rem; min-width: 340px; max-width: 95vw; display: flex; flex-direction: column; gap: 1.2rem; }
.modal h2 { font-size: 1.2rem; }
.score-adjust-row { display: flex; align-items: center; gap: .75rem; padding: .6rem; background: var(--surface2); border-radius: 8px; }
.score-adjust-row .team-dot { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; }
.score-adjust-row .team-label { flex: 1; font-weight: 600; }
.score-adjust-row .cur-score { font-size: 1.2rem; font-weight: 700; min-width: 60px; text-align: right; }
.adjust-input { width: 70px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: .3em .5em; font-size: .95rem; text-align: center; font-family: inherit; }
.adj-plus  { background: var(--green); color: #fff; border: none; border-radius: 6px; padding: .3em .7em; cursor: pointer; font-weight: 700; }
.adj-minus { background: var(--red);   color: #fff; border: none; border-radius: 6px; padding: .3em .7em; cursor: pointer; font-weight: 700; }
</style>
</head>
<body>

<!-- EVENT POPUP -->
<div class="event-popup" id="event-popup">
  <div class="event-popup-points" id="event-points"></div>
  <div class="event-popup-name"   id="event-name"></div>
</div>

<!-- SETUP -->
<div id="screen-setup" class="screen active">
  <div class="setup-container">
    <h1 class="logo">🎯 КВИЗ</h1>
    <section class="setup-section">
      <h2>Раунды</h2>
      <div id="rounds-list"></div>
      <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem">
        <button class="btn btn-secondary" id="add-round-btn">+ Добавить раунд (JSON)</button>
        <a href="editor.html" class="btn btn-ghost" target="_blank">Редактор паков →</a>
      </div>
      <p class="setup-hint">Загружай JSON-файлы паков — по одному файлу на каждый раунд</p>
    </section>
    <section class="setup-section">
      <h2>Команды</h2>
      <div id="teams-list"></div>
      <button class="btn btn-secondary" id="add-team-btn" style="margin-top:.5rem">+ Добавить команду</button>
    </section>
    <button class="btn btn-primary btn-large" id="start-game-btn">Начать игру</button>
  </div>
</div>

<!-- BOARD -->
<div id="screen-board" class="screen">
  <header class="board-header">
    <div id="scores-bar"></div>
    <div class="board-controls">
      <span id="round-label" class="round-label"></span>
      <button class="btn btn-ghost btn-sm" id="adjust-scores-btn">± Баллы</button>
      <button class="btn btn-ghost btn-sm" id="next-round-btn" style="display:none">Следующий раунд →</button>
      <button class="btn btn-ghost btn-sm" id="back-setup-btn">Настройки</button>
    </div>
  </header>
  <div id="board-grid" class="board-grid"></div>
</div>

<!-- QUESTION -->
<div id="screen-question" class="screen">
  <div class="question-layout">
    <div class="question-top">
      <div>
        <span class="question-value" id="q-value"></span>
        <span class="q-cat-label" id="q-cat-label" style="margin-left:.75rem"></span>
      </div>
      <button class="btn btn-ghost btn-sm" id="q-back-btn">← Поле</button>
    </div>
    <div class="question-body">
      <div id="q-type-badge" style="display:none" class="q-type-badge"></div>
      <p id="q-text" class="q-text"></p>
      <img id="q-image" class="q-media" style="display:none">
      <audio id="q-audio" controls style="display:none"></audio>
      <div id="q-video-wrap" style="display:none"><video id="q-video" controls class="q-media"></video></div>
    </div>
    <div class="buzz-display" id="buzz-display" style="display:none">
      <div class="buzz-team" id="buzz-team-name"></div>
    </div>
    <div class="timer-row">
      <div class="timer-circle">
        <svg viewBox="0 0 120 120">
          <circle class="timer-bg" cx="60" cy="60" r="54"/>
          <circle class="timer-arc" id="timer-arc" cx="60" cy="60" r="54" stroke-dasharray="339.3" stroke-dashoffset="0"/>
        </svg>
        <span class="timer-text" id="timer-text">60</span>
      </div>
    </div>
    <div class="question-controls">
      <button class="btn btn-success btn-large" id="q-correct-btn" style="display:none">✓ Верно</button>
      <button class="btn btn-danger  btn-large" id="q-wrong-btn"   style="display:none">✗ Неверно</button>
      <button class="btn btn-secondary" id="q-start-btn">▶ Пробел — запустить таймер</button>
      <button class="btn btn-ghost"     id="q-annul-btn">Аннулировать</button>
    </div>
  </div>
  <div id="answer-overlay" class="answer-overlay" style="display:none">
    <div class="answer-box">
      <h2>Ответ</h2>
      <p id="ans-text" class="ans-text"></p>
      <img id="ans-image" class="q-media" style="display:none">
      <audio id="ans-audio" controls style="display:none"></audio>
      <video id="ans-video" controls class="q-media" style="display:none"></video>
      <button class="btn btn-primary btn-large" id="ans-close-btn">← К полю</button>
    </div>
  </div>
</div>

<!-- SCORE MODAL -->
<div id="modal-scores" class="modal-overlay" style="display:none">
  <div class="modal">
    <h2>Промежуточные итоги</h2>
    <div id="modal-scores-list"></div>
    <button class="btn btn-primary" id="modal-scores-close">Закрыть</button>
  </div>
</div>

<script>
/* ===== AUDIO ENGINE ===== */
let _actx = null;
function actx() {
  if (!_actx) _actx = new (window.AudioContext || window.webkitAudioContext)();
  return _actx;
}
function tone(freq, type, duration, gain=.4, delay=0) {
  try {
    const ctx = actx(), o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = freq; o.type = type;
    const t = ctx.currentTime + delay;
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(.001, t + duration);
    o.start(t); o.stop(t + duration);
  } catch {}
}
function noise(duration, gain=.2) {
  try {
    const ctx = actx(), buf = ctx.createBuffer(1, ctx.sampleRate*duration, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0; i<d.length; i++) d[i] = (Math.random()*2-1);
    const src = ctx.createBufferSource(), g = ctx.createGain();
    src.buffer = buf; src.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(gain, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+duration);
    src.start();
  } catch {}
}

const SFX = {
  click()   { tone(800, 'sine', .05, .15); },
  buzz()    { tone(150,'sawtooth',.15,.5); tone(120,'sawtooth',.15,.3,.1); },
  correct() { tone(523,'sine',.12,.4); tone(659,'sine',.12,.4,.12); tone(784,'sine',.25,.4,.24); },
  wrong()   { tone(250,'sawtooth',.1,.5); tone(200,'sawtooth',.1,.5,.1); tone(150,'square',.2,.4,.2); },
  timerEnd(){ for(let i=0;i<3;i++) tone(880,'square',.12,.35,i*.2); },
  slide()   { tone(400,'sine',.1,.2); tone(600,'sine',.1,.15,.08); },
  intro()   { [523,659,784,1047].forEach((f,i)=>tone(f,'sine',.18,.35,i*.15)); },
  reveal()  { tone(440,'sine',.08,.2); tone(550,'sine',.15,.3,.1); },
};

/* hover click on all buttons */
document.addEventListener('mouseover', e => {
  if (e.target.closest('.btn, .question-cell, .round-order-btn, .round-remove-btn, .team-remove-btn, .adj-plus, .adj-minus'))
    SFX.click();
});

/* ===== EVENT POPUP ===== */
let popupTimer = null;
function showEventPopup(points, teamName, color) {
  const popup = document.getElementById('event-popup');
  document.getElementById('event-points').textContent = (points>0?'+':'')+points;
  document.getElementById('event-points').style.color = points>0 ? '#2ecc71' : '#e74c3c';
  document.getElementById('event-name').textContent = teamName;
  document.getElementById('event-name').style.color = color;
  popup.classList.remove('hide');
  popup.classList.add('show');
  clearTimeout(popupTimer);
  popupTimer = setTimeout(() => {
    popup.classList.remove('show');
    popup.classList.add('hide');
    setTimeout(() => popup.classList.remove('hide'), 500);
  }, 1800);
}

/* ===== STATE ===== */
const state = {
  rounds: [], roundIdx: 0, teams: [],
  usedQuestions: {}, currentQ: null,
  timerRunning: false, timerSeconds: 60, timerInterval: null,
  buzzedTeam: null, teamsAnsweredWrong: new Set(),
};
const TEAM_COLORS = ["#4f8ef7","#e74c3c","#27ae60","#9b59b6","#f39c12","#1abc9c"];
const ARC = 339.3;

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  if (id === 'screen-board') SFX.slide();
}

/* ===== SETUP ===== */
let setupRounds = [];
let setupTeams  = [{name:"Команда 1",color:TEAM_COLORS[0]},{name:"Команда 2",color:TEAM_COLORS[1]}];

function renderRounds() {
  const el = document.getElementById("rounds-list");
  el.innerHTML = "";
  if (!setupRounds.length) {
    el.innerHTML='<p style="color:var(--text-muted);font-size:.85rem">Раундов пока нет — добавь JSON-файл пака</p>';
    return;
  }
  setupRounds.forEach((r,i) => {
    const row = document.createElement("div"); row.className="round-item";
    row.innerHTML=`
      <span style="color:var(--text-muted);font-size:.8rem;flex-shrink:0">Раунд ${i+1}</span>
      <span class="round-name">${r.packName}</span>
      <button class="round-order-btn">▲</button>
      <button class="round-order-btn">▼</button>
      <button class="round-remove-btn">✕</button>`;
    row.querySelectorAll(".round-order-btn")[0].onclick=()=>{if(i>0){[setupRounds[i-1],setupRounds[i]]=[setupRounds[i],setupRounds[i-1]];renderRounds();}};
    row.querySelectorAll(".round-order-btn")[1].onclick=()=>{if(i<setupRounds.length-1){[setupRounds[i],setupRounds[i+1]]=[setupRounds[i+1],setupRounds[i]];renderRounds();}};
    row.querySelector(".round-remove-btn").onclick=()=>{setupRounds.splice(i,1);renderRounds();};
    el.appendChild(row);
  });
}

document.getElementById("add-round-btn").onclick = () => {
  const input = document.createElement("input");
  input.type="file"; input.accept=".json";
  input.onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const pack = JSON.parse(await file.text());
      setupRounds.push({packName: pack.name||file.name.replace(/\.json$/,""), pack});
      renderRounds(); SFX.slide();
    } catch { alert("Ошибка чтения файла. Убедись, что это JSON-файл пака."); }
  };
  input.click();
};

function renderSetupTeams() {
  const el = document.getElementById("teams-list"); el.innerHTML="";
  setupTeams.forEach((t,i) => {
    const row = document.createElement("div"); row.className="team-item";
    row.innerHTML=`
      <div class="team-color" style="background:${t.color}" title="Кликни чтобы сменить цвет"></div>
      <input class="team-name-input" value="${t.name}" placeholder="Название команды">
      <button class="team-remove-btn">✕</button>`;
    row.querySelector(".team-color").onclick=()=>{t.color=TEAM_COLORS[(TEAM_COLORS.indexOf(t.color)+1)%TEAM_COLORS.length];renderSetupTeams();};
    row.querySelector(".team-name-input").oninput=e=>{setupTeams[i].name=e.target.value;};
    row.querySelector(".team-remove-btn").onclick=()=>{setupTeams.splice(i,1);renderSetupTeams();};
    el.appendChild(row);
  });
}

document.getElementById("add-team-btn").onclick=()=>{
  if(setupTeams.length>=6)return;
  setupTeams.push({name:`Команда ${setupTeams.length+1}`,color:TEAM_COLORS[setupTeams.length%TEAM_COLORS.length]});
  renderSetupTeams();
};

document.getElementById("start-game-btn").onclick=()=>{
  if(!setupRounds.length){alert("Добавь хотя бы один раунд.");return;}
  if(!setupTeams.length){alert("Добавь хотя бы одну команду.");return;}
  if(setupTeams.some(t=>!t.name.trim())){alert("У всех команд должны быть названия.");return;}
  state.rounds=setupRounds.map(r=>({...r}));
  state.roundIdx=0;
  state.teams=setupTeams.map(t=>({...t,score:0}));
  state.usedQuestions={};
  SFX.intro();
  startRound(0);
};

/* ===== BOARD ===== */
function startRound(idx) {
  state.roundIdx=idx; buildBoard(); renderScoresBar(); updateRoundLabel(); checkRoundComplete();
  showScreen("screen-board");
}

function updateRoundLabel() {
  document.getElementById("round-label").textContent=
    `Раунд ${state.roundIdx+1}/${state.rounds.length}: ${state.rounds[state.roundIdx].packName}`;
}

function buildBoard() {
  const pack=state.rounds[state.roundIdx].pack, grid=document.getElementById("board-grid");
  const cats=pack.categories||[];
  if(!cats.length){grid.innerHTML="<p>Нет категорий в паке.</p>";return;}
  const maxQ=Math.max(...cats.map(c=>c.questions.length));
  grid.style.gridTemplateColumns=`repeat(${cats.length},1fr)`;
  grid.innerHTML="";
  cats.forEach(cat=>{
    const h=document.createElement("div"); h.className="category-header";
    h.textContent=cat.name; grid.appendChild(h);
  });
  for(let qi=0;qi<maxQ;qi++){
    cats.forEach((cat,ci)=>{
      const q=cat.questions[qi], cell=document.createElement("div");
      const key=`${state.roundIdx}-${ci}-${qi}`;
      if(!q){cell.className="question-cell used";}
      else{
        cell.className="question-cell"+(state.usedQuestions[key]?" used":"");
        cell.innerHTML=`<span>${q.value}</span>`;
        if(q.type==="bag")     cell.innerHTML+=`<span class="cell-badge badge-bag">🎁 Кот в мешке</span>`;
        if(q.type==="auction") cell.innerHTML+=`<span class="cell-badge badge-auction">🔨 Аукцион</span>`;
        cell.onclick=()=>openQuestion(ci,qi);
      }
      grid.appendChild(cell);
    });
  }
}

function renderScoresBar() {
  document.getElementById("scores-bar").innerHTML=state.teams.map((t,i)=>`
    <div class="score-chip" style="background:${t.color}22;border:2px solid ${t.color}">
      <span class="team-name">${t.name}</span>
      <span class="team-score" id="score-${i}">${t.score}</span>
    </div>`).join("");
}

function updateScoreDisplays(){
  state.teams.forEach((t,i)=>{const el=document.getElementById(`score-${i}`);if(el)el.textContent=t.score;});
}

function checkRoundComplete(){
  const pack=state.rounds[state.roundIdx].pack;
  const all=(pack.categories||[]).every((cat,ci)=>cat.questions.every((_,qi)=>state.usedQuestions[`${state.roundIdx}-${ci}-${qi}`]));
  document.getElementById("next-round-btn").style.display=(all&&state.roundIdx+1<state.rounds.length)?"inline-flex":"none";
}

document.getElementById("adjust-scores-btn").onclick=openScoreModal;
document.getElementById("modal-scores-close").onclick=()=>{document.getElementById("modal-scores").style.display="none";};
function openScoreModal(){
  document.getElementById("modal-scores-list").innerHTML=state.teams.map((t,i)=>`
    <div class="score-adjust-row">
      <div class="team-dot" style="background:${t.color}"></div>
      <span class="team-label">${t.name}</span>
      <span class="cur-score" id="modal-score-${i}">${t.score}</span>
      <input class="adjust-input" type="number" value="100" min="0" id="adj-input-${i}">
      <button class="adj-plus"  onclick="adjustScore(${i},+1)">+</button>
      <button class="adj-minus" onclick="adjustScore(${i},-1)">−</button>
    </div>`).join("");
  document.getElementById("modal-scores").style.display="flex";
}
function adjustScore(idx,sign){
  const val=parseInt(document.getElementById(`adj-input-${idx}`).value)||0;
  state.teams[idx].score+=sign*val;
  document.getElementById(`modal-score-${idx}`).textContent=state.teams[idx].score;
  updateScoreDisplays();
}

document.getElementById("next-round-btn").onclick=()=>{if(state.roundIdx+1<state.rounds.length)startRound(state.roundIdx+1);};
document.getElementById("back-setup-btn").onclick=()=>showScreen("screen-setup");

/* ===== QUESTION ===== */
function openQuestion(catIdx,qIdx){
  const key=`${state.roundIdx}-${catIdx}-${qIdx}`;
  if(state.usedQuestions[key])return;
  const cat=state.rounds[state.roundIdx].pack.categories[catIdx];
  const q=cat.questions[qIdx];
  state.currentQ={catIdx,qIdx,key,q,catName:cat.name};
  state.buzzedTeam=null; state.teamsAnsweredWrong=new Set();
  resetTimer(); populateQuestion(q,cat.name);
  setBuzzDisplay(null); showAnswerJudgeBtns(false);
  document.getElementById("answer-overlay").style.display="none";
  SFX.slide();
  showScreen("screen-question");
}

function populateQuestion(q,catName){
  document.getElementById("q-value").textContent=q.value+" баллов";

  // category label & type badge
  const catLbl=document.getElementById("q-cat-label");
  const typeBadge=document.getElementById("q-type-badge");
  if(q.type==="bag"){
    catLbl.textContent=""; typeBadge.textContent="🎁 Кот в мешке"; typeBadge.className="q-type-badge q-type-bag"; typeBadge.style.display="inline-block";
  } else if(q.type==="auction"){
    catLbl.textContent=catName; typeBadge.textContent="🔨 Вопрос-аукцион"; typeBadge.className="q-type-badge q-type-auction"; typeBadge.style.display="inline-block";
  } else {
    catLbl.textContent=catName; typeBadge.style.display="none";
  }

  document.getElementById("q-text").textContent=q.question||"";
  const img=document.getElementById("q-image");
  if(q.image){img.src=q.image;img.style.display="block";}else img.style.display="none";
  const aud=document.getElementById("q-audio");
  if(q.audio){aud.src=q.audio;aud.style.display="block";}else aud.style.display="none";
  const vidW=document.getElementById("q-video-wrap"),vid=document.getElementById("q-video");
  if(q.video){vid.src=q.video;vidW.style.display="block";}else vidW.style.display="none";
  document.getElementById("q-start-btn").style.display="inline-flex";
  document.getElementById("q-annul-btn").style.display="inline-flex";
}

/* TIMER */
function resetTimer(){clearInterval(state.timerInterval);state.timerRunning=false;state.timerSeconds=60;updateTimerDisplay(60,60);}
function startTimer(){
  if(state.timerRunning)return;
  state.timerRunning=true;
  state.timerInterval=setInterval(()=>{
    state.timerSeconds--;
    updateTimerDisplay(state.timerSeconds,60);
    if(state.timerSeconds<=0){clearInterval(state.timerInterval);state.timerRunning=false;SFX.timerEnd();flashScreen();}
  },1000);
}
function pauseTimer(){clearInterval(state.timerInterval);state.timerRunning=false;}
function resumeTimer(){if(state.timerSeconds>0)startTimer();}
function updateTimerDisplay(s,total){
  document.getElementById("timer-text").textContent=s;
  const arc=document.getElementById("timer-arc"),f=s/total;
  arc.style.strokeDashoffset=ARC*(1-f);
  arc.classList.toggle("warning",f<=.5&&f>.25);
  arc.classList.toggle("danger",f<=.25);
}
function flashScreen(){document.body.style.background="#fff";setTimeout(()=>{document.body.style.background="";},250);}

/* BUZZ */
function onBuzzerPress(teamIdx){
  if(!state.teams[teamIdx])return;
  if(!state.timerRunning&&state.timerSeconds===60)return;
  if(state.buzzedTeam!==null)return;
  if(state.teamsAnsweredWrong.has(teamIdx))return;
  pauseTimer(); state.buzzedTeam=teamIdx;
  SFX.buzz(); setBuzzDisplay(teamIdx); showAnswerJudgeBtns(true);
  document.getElementById("q-start-btn").style.display="none";
}
function setBuzzDisplay(idx){
  const el=document.getElementById("buzz-display"),nm=document.getElementById("buzz-team-name");
  if(idx===null){el.style.display="none";return;}
  const t=state.teams[idx]; nm.textContent=t.name; nm.style.background=t.color; el.style.display="block";
}
function showAnswerJudgeBtns(show){
  document.getElementById("q-correct-btn").style.display=show?"inline-flex":"none";
  document.getElementById("q-wrong-btn").style.display=show?"inline-flex":"none";
}

document.getElementById("q-correct-btn").onclick=()=>{
  const q=state.currentQ.q, team=state.teams[state.buzzedTeam];
  team.score+=q.value; updateScoreDisplays();
  SFX.correct();
  showEventPopup(q.value, team.name, team.color);
  closeQuestion(true);
};
document.getElementById("q-wrong-btn").onclick=()=>{
  const q=state.currentQ.q, team=state.teams[state.buzzedTeam];
  let penalty=0;
  if(q.penalty==="half") penalty=Math.floor(q.value/2);
  else if(q.penalty==="full") penalty=q.value;
  if(penalty>0){team.score-=penalty;showEventPopup(-penalty,team.name,team.color);}
  updateScoreDisplays(); SFX.wrong();
  state.teamsAnsweredWrong.add(state.buzzedTeam);
  state.buzzedTeam=null; setBuzzDisplay(null); showAnswerJudgeBtns(false);
  document.getElementById("q-start-btn").style.display="inline-flex";
  if(state.teams.every((_,i)=>state.teamsAnsweredWrong.has(i))||
     state.teams.filter((_,i)=>!state.teamsAnsweredWrong.has(i)).length===0)
    closeQuestion(false);
  else resumeTimer();
};
document.getElementById("q-annul-btn").onclick=()=>closeQuestion(false);
document.getElementById("q-back-btn").onclick=()=>{pauseTimer();showScreen("screen-board");};
document.getElementById("q-start-btn").onclick=()=>{if(!state.timerRunning)startTimer();};

document.getElementById("ans-close-btn").onclick=()=>{
  document.getElementById("answer-overlay").style.display="none";
  state.usedQuestions[state.currentQ.key]=true;
  buildBoard();checkRoundComplete();showScreen("screen-board");
};

function closeQuestion(correct){
  pauseTimer();
  const rev=state.currentQ.q.answer_reveal;
  const hasReveal=rev&&(rev.text||rev.image||rev.audio||rev.video);
  if(hasReveal){
    SFX.reveal();
    document.getElementById("ans-text").textContent=rev.text||"";
    const ai=document.getElementById("ans-image");
    if(rev.image){ai.src=rev.image;ai.style.display="block";}else ai.style.display="none";
    const aa=document.getElementById("ans-audio");
    if(rev.audio){aa.src=rev.audio;aa.style.display="block";}else aa.style.display="none";
    const av=document.getElementById("ans-video");
    if(rev.video){av.src=rev.video;av.style.display="block";}else av.style.display="none";
    document.getElementById("answer-overlay").style.display="flex";
  } else {
    state.usedQuestions[state.currentQ.key]=true;
    buildBoard();checkRoundComplete();showScreen("screen-board");
  }
}

/* KEYBOARD */
document.addEventListener("keydown",e=>{
  const sc=document.querySelector(".screen.active"); if(!sc)return;
  if(sc.id==="screen-question"){
    if(e.code==="Space"){e.preventDefault();if(!state.timerRunning)startTimer();}
    const k={"1":0,"2":1,"3":2,"4":3,"5":4,"6":5}[e.key];
    if(k!==undefined)onBuzzerPress(k);
  }
});

/* INIT */
renderRounds(); renderSetupTeams();
</script>
</body>
</html>
