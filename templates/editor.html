<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Редактор паков</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="editor-page">
<div class="editor-layout">

  <!-- Sidebar: list of packs -->
  <aside class="sidebar">
    <h2>Паки вопросов</h2>
    <div id="pack-list"></div>
    <button class="btn btn-secondary" style="margin-top:.5rem" id="new-pack-btn">+ Новый пак</button>
    <a href="/" class="btn btn-ghost" style="margin-top:.5rem">← Назад</a>
  </aside>

  <!-- Main editor area -->
  <main class="editor-main" id="editor-main">
    <p style="color:var(--text-muted);margin-top:3rem;text-align:center">Выбери пак слева или создай новый</p>
  </main>
</div>

<script src="/static/js/editor.js"></script>
</body>
</html>
