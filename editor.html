<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Редактор паков — Квиз</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a1a; --surface: #12122a; --surface2: #1e1e3a; --border: #2a2a4a;
  --accent: #4f8ef7; --green: #27ae60; --red: #e74c3c;
  --text: #e8e8f0; --text-muted: #888aaa; --gold: #f1c40f; --radius: 12px;
}
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.btn { display: inline-flex; align-items: center; justify-content: center; padding: .55em 1.2em; border: none; border-radius: var(--radius); cursor: pointer; font-size: 1rem; font-weight: 600; transition: opacity .15s; text-decoration: none; white-space: nowrap; font-family: inherit; }
.btn:hover { opacity: .85; }
.btn-primary  { background: var(--accent); color: #fff; }
.btn-secondary{ background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-ghost    { background: transparent; color: var(--text-muted); }
.btn-sm       { font-size: .85rem; padding: .35em .8em; }
.btn-danger   { background: var(--red); color: #fff; }

.editor-layout { display: flex; min-height: 100vh; }
.sidebar { width: 240px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 1rem; gap: .5rem; }
.sidebar h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; color: var(--text-muted); margin-bottom: .25rem; }
.sidebar-hint { font-size: .75rem; color: var(--text-muted); line-height: 1.5; }
.editor-main { flex: 1; padding: 1.5rem; overflow-y: auto; }
.editor-main > p { color: var(--text-muted); margin-top: 3rem; text-align: center; }

input[type="text"], input[type="number"], textarea, select {
  background: var(--surface2); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: .5em .8em; font-size: .95rem; width: 100%; font-family: inherit;
}
input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); border-color: transparent; }

.pack-header { display: flex; gap: .75rem; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; }
.pack-name-input { font-size: 1.1rem; flex: 1; min-width: 200px; }

.category-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 1.5rem; overflow: hidden; }
.cat-header { display: flex; align-items: center; gap: .75rem; padding: .75rem 1rem; background: var(--surface2); border-bottom: 1px solid var(--border); }
.cat-header input { font-weight: 600; font-size: 1rem; }
.cat-body { padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
.cat-footer { padding: .5rem 1rem 1rem; }

.q-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; display: flex; flex-direction: column; gap: .75rem; }
.q-card-top { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
.q-card-top label { font-size: .82rem; color: var(--text-muted); white-space: nowrap; }

.penalty-toggle { display: flex; gap: .4rem; }
.penalty-btn { padding: .3em .65em; border-radius: 6px; font-size: .8rem; font-weight: 600; border: 1px solid var(--border); background: var(--surface2); color: var(--text-muted); cursor: pointer; font-family: inherit; }
.penalty-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.type-toggle { display: flex; gap: .4rem; }
.type-btn { padding: .3em .65em; border-radius: 6px; font-size: .8rem; font-weight: 600; border: 1px solid var(--border); background: var(--surface2); color: var(--text-muted); cursor: pointer; font-family: inherit; }
.type-btn.active-normal  { background: var(--accent); color: #fff; border-color: var(--accent); }
.type-btn.active-bag     { background: #9b59b6; color: #fff; border-color: #9b59b6; }
.type-btn.active-auction { background: var(--gold); color: #000; border-color: var(--gold); }
.type-btn.active-last    { background: #2ecc71; color: #000; border-color: #2ecc71; }
.type-btn.active-blitz   { background: #f39c12; color: #000; border-color: #f39c12; }
.blitz-section { border-top:1px solid var(--border); padding-top:.75rem; margin-top:.25rem; display:flex; flex-direction:column; gap:.4rem; }
.blitz-list { display:flex; flex-direction:column; gap:.5rem; }
.blitz-sub-row { display:flex; align-items:flex-start; gap:.4rem; }
.blitz-sub-num { font-size:.85rem; color:var(--text-muted); font-weight:700; min-width:1.5rem; padding-top:.55rem; flex-shrink:0; }
.blitz-sub-q { flex:2; min-width:0; font-family:inherit; }
.blitz-sub-a { flex:1; min-width:0; }

/* Media picker */
.media-picker { display: flex; flex-direction: column; gap: .4rem; }
.media-picker-row { display: flex; align-items: center; gap: .5rem; }
.media-picker-row label { font-size: .8rem; color: var(--text-muted); min-width: 60px; }
.pick-btn { background: var(--surface2); border: 1px dashed var(--border); color: var(--text-muted); border-radius: 6px; padding: .3em .8em; cursor: pointer; font-size: .82rem; font-family: inherit; flex-shrink: 0; }
.pick-btn:hover { border-color: var(--accent); color: var(--accent); }
.media-filename { font-size: .78rem; color: var(--accent); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.media-clear { background: none; border: none; color: var(--red); cursor: pointer; font-size: 1rem; flex-shrink: 0; }
.media-preview-img { max-height: 80px; border-radius: 4px; display: block; margin-top: .3rem; }

.reveal-block { border-top: 1px solid var(--border); padding-top: .75rem; margin-top: .25rem; display: flex; flex-direction: column; gap: .75rem; }
.reveal-toggle { background: none; border: 1px dashed var(--border); color: var(--text-muted); border-radius: 6px; padding: .3em .8em; cursor: pointer; font-size: .82rem; font-family: inherit; width: fit-content; }
.reveal-toggle:hover { border-color: var(--accent); color: var(--accent); }

.buzz-toggle { display: flex; gap: .3rem; margin-left: auto; }
.buzz-btn { padding: .25em .6em; border-radius: 6px; font-size: .78rem; font-weight: 600; border: 1px solid var(--border); background: var(--surface2); color: var(--text-muted); cursor: pointer; font-family: inherit; }
.buzz-btn.active-unlimited { background: #27ae60; color: #fff; border-color: #27ae60; }
.buzz-btn.active-one_chance { background: #e67e22; color: #fff; border-color: #e67e22; }

.info-banner { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: .85rem 1rem; margin-bottom: 1.5rem; font-size: .85rem; color: var(--text-muted); line-height: 1.6; }
.info-banner strong { color: var(--text); }
</style>
</head>
<body>
<div class="editor-layout">
  <aside class="sidebar">
    <h2>Редактор паков</h2>
    <button class="btn btn-secondary" id="new-pack-btn">+ Создать пак</button>
    <button class="btn btn-ghost" id="load-pack-btn">Открыть JSON…</button>
    <hr style="border-color:var(--border);margin:.25rem 0">
    <p class="sidebar-hint">Медиафайлы (фото, аудио, видео) встраиваются прямо в JSON — никаких отдельных папок не нужно.</p>
    <p class="sidebar-hint" style="margin-top:.5rem">⚠️ Большие видеофайлы сильно увеличат размер JSON.</p>
    <hr style="border-color:var(--border);margin:.25rem 0">
    <a href="index.html" class="btn btn-ghost btn-sm">← Назад в игру</a>
  </aside>
  <main class="editor-main" id="editor-main">
    <p>Создай новый пак или открой существующий JSON</p>
  </main>
</div>

<script>
let pack = null;

document.getElementById("new-pack-btn").onclick = () => {
  pack = { name: "Новый пак", categories: [] };
  renderEditor();
};

document.getElementById("load-pack-btn").onclick = () => {
  pickFile(".json", async file => {
    try { pack = JSON.parse(await file.text()); renderEditor(); }
    catch { alert("Не удалось прочитать JSON."); }
  });
};

/* ── File helpers ── */
function pickFile(accept, cb) {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = accept;
  inp.onchange = e => { if (e.target.files[0]) cb(e.target.files[0]); };
  inp.click();
}

function fileToDataURL(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = e => res(e.target.result);
    r.readAsDataURL(file);
  });
}

function mimeToAccept(field) {
  if (field === "image") return "image/*";
  if (field === "audio") return "audio/*";
  if (field === "video") return "video/*";
  return "*";
}

function shortName(dataUrl, origName) {
  if (!dataUrl) return "";
  if (origName) return origName;
  const m = dataUrl.match(/^data:([^;]+)/);
  return m ? m[1] : "файл";
}

/* ── Editor render ── */
function renderEditor() {
  const main = document.getElementById("editor-main");
  main.innerHTML = "";

  const banner = document.createElement("div");
  banner.className = "info-banner";
  banner.innerHTML = `<strong>Типы вопросов:</strong> обычный | <span style="color:#9b59b6">🎁 Кот в мешке</span> — категория скрыта | <span style="color:var(--gold)">🔨 Аукцион</span> — ставки | <span style="color:#2ecc71">🏁 Назови последним</span> — баллы у последнего верного | <span style="color:#f39c12">⚡ Блиц</span> — серия подвопросов, баллы = стоимость ÷ кол-во<br><strong>Баззер:</strong> <span style="color:#27ae60">∞ спам</span> — команды жмут сколько угодно | <span style="color:#e67e22">1 шанс</span> — каждая один раз`;
  main.appendChild(banner);

  const header = document.createElement("div");
  header.className = "pack-header";
  header.innerHTML = `
    <input class="pack-name-input" type="text" value="${esc(pack.name)}" placeholder="Название пака">
    <button class="btn btn-primary" id="dl-btn">⬇ Скачать JSON</button>
  `;
  header.querySelector(".pack-name-input").oninput = e => { pack.name = e.target.value; };
  header.querySelector("#dl-btn").onclick = downloadPack;
  main.appendChild(header);

  const catContainer = document.createElement("div");
  catContainer.id = "cat-container";
  main.appendChild(catContainer);
  renderCategories(catContainer);

  const addBtn = document.createElement("button");
  addBtn.className = "btn btn-secondary";
  addBtn.textContent = "+ Добавить категорию";
  addBtn.onclick = () => { pack.categories.push({name:"Новая категория",buzz_mode:"unlimited",questions:[]}); renderCategories(catContainer); };
  main.appendChild(addBtn);
}

function renderCategories(container) {
  container.innerHTML = "";
  pack.categories.forEach((cat, ci) => container.appendChild(buildCategoryBlock(cat, ci, container)));
}

function buildCategoryBlock(cat, ci, container) {
  const block = document.createElement("div");
  block.className = "category-block";
  const bm = cat.buzz_mode || "unlimited";
  block.innerHTML = `
    <div class="cat-header">
      <input type="text" value="${esc(cat.name)}" placeholder="Название категории" style="flex:1">
      <div class="buzz-toggle" title="Режим баззера для этой категории">
        <button class="buzz-btn ${bm==="unlimited"?"active-unlimited":""}" data-bm="unlimited">∞ спам</button>
        <button class="buzz-btn ${bm==="one_chance"?"active-one_chance":""}" data-bm="one_chance">1 шанс</button>
      </div>
      <button class="btn btn-ghost btn-sm" style="color:var(--red)">✕</button>
    </div>
    <div class="cat-body" id="cb-${ci}"></div>
    <div class="cat-footer"><button class="btn btn-secondary btn-sm aq-btn">+ Вопрос</button></div>
  `;
  block.querySelector(".cat-header input").oninput = e => { cat.name = e.target.value; };
  block.querySelectorAll(".buzz-btn").forEach(b => {
    b.onclick = () => {
      cat.buzz_mode = b.dataset.bm;
      block.querySelectorAll(".buzz-btn").forEach(x => {
        x.className = "buzz-btn" + (x === b ? " active-" + b.dataset.bm : "");
      });
    };
  });
  block.querySelector(".cat-header .btn-ghost").onclick = () => {
    if (!confirm("Удалить категорию со всеми вопросами?")) return;
    pack.categories.splice(ci, 1); renderCategories(container);
  };
  block.querySelector(".aq-btn").onclick = () => {
    cat.questions.push({value:100,timer:60,question:"",type:"normal",penalty:"none",image:null,audio:null,video:null,answer_reveal:null});
    renderCategories(container);
  };
  const body = block.querySelector(`#cb-${ci}`);
  cat.questions.forEach((q, qi) => body.appendChild(buildQuestionCard(q, ci, qi, container)));
  return block;
}

function buildQuestionCard(q, ci, qi, container) {
  const card = document.createElement("div");
  card.className = "q-card";

  // Top row
  const top = document.createElement("div");
  top.className = "q-card-top";
  top.innerHTML = `
    <label>Стоимость</label>
    <input id="qv-${ci}-${qi}" type="number" value="${q.value||100}" min="0" step="50" style="width:85px${q.random_value?';display:none':''}">
    <label style="display:flex;align-items:center;gap:.3rem;cursor:pointer;font-size:.82rem;white-space:nowrap"><input id="qrv-${ci}-${qi}" type="checkbox" ${q.random_value?'checked':''}> Случайная</label>
    <span id="qrr-${ci}-${qi}" style="display:${q.random_value?'flex':'none'};align-items:center;gap:.25rem;font-size:.8rem;white-space:nowrap">от <input id="qrmin-${ci}-${qi}" type="number" value="${q.value_min||100}" min="0" step="50" style="width:65px"> до <input id="qrmax-${ci}-${qi}" type="number" value="${q.value_max||500}" min="0" step="50" style="width:65px"></span>
    <label>Таймер&nbsp;(сек)</label>
    <input id="qtmr-${ci}-${qi}" type="number" value="${q.timer||60}" min="10" max="300" step="5" style="width:75px">
    <label>Штраф</label>
    <div class="penalty-toggle">
      <button class="penalty-btn ${(q.penalty||"none")==="none"?"active":""}" data-p="none">Нет</button>
      <button class="penalty-btn ${(q.penalty||"none")==="half"?"active":""}" data-p="half">−½</button>
      <button class="penalty-btn ${(q.penalty||"none")==="full"?"active":""}" data-p="full">−всё</button>
    </div>
    <label>Тип</label>
    <div class="type-toggle">
      <button class="type-btn ${!q.type||q.type==="normal"?"active-normal":""}" data-t="normal">Обычный</button>
      <button class="type-btn ${q.type==="bag"?"active-bag":""}" data-t="bag">🎁 Кот в мешке</button>
      <button class="type-btn ${q.type==="auction"?"active-auction":""}" data-t="auction">🔨 Аукцион</button>
      <button class="type-btn ${q.type==="last"?"active-last":""}" data-t="last">🏁 Назови последним</button>
      <button class="type-btn ${q.type==="blitz"?"active-blitz":""}" data-t="blitz">⚡ Блиц</button>
    </div>
    <button class="btn btn-ghost btn-sm" style="color:var(--red);margin-left:auto">✕</button>
  `;
  const valInp = top.querySelector(`#qv-${ci}-${qi}`);
  valInp.oninput = e => { q.value=parseInt(e.target.value)||0; };
  top.querySelector(`#qtmr-${ci}-${qi}`).oninput = e => { q.timer=parseInt(e.target.value)||60; };
  const rvCb = top.querySelector(`#qrv-${ci}-${qi}`);
  const rvRange = top.querySelector(`#qrr-${ci}-${qi}`);
  rvCb.onchange = () => {
    q.random_value = rvCb.checked;
    valInp.style.display = q.random_value ? 'none' : '';
    rvRange.style.display = q.random_value ? 'flex' : 'none';
  };
  top.querySelector(`#qrmin-${ci}-${qi}`).oninput = e => { q.value_min=parseInt(e.target.value)||100; };
  top.querySelector(`#qrmax-${ci}-${qi}`).oninput = e => { q.value_max=parseInt(e.target.value)||500; };
  top.querySelectorAll(".penalty-btn").forEach(b => {
    b.onclick = () => { q.penalty=b.dataset.p; top.querySelectorAll(".penalty-btn").forEach(x=>x.classList.toggle("active",x===b)); };
  });
  let blitzSection, timerSection;
  top.querySelectorAll(".type-btn").forEach(b => {
    b.onclick = () => {
      q.type=b.dataset.t;
      if (q.type === 'blitz' && !q.sub_questions) q.sub_questions = [];
      top.querySelectorAll(".type-btn").forEach(x=>{ x.className="type-btn"; });
      b.classList.add(b.dataset.t==="bag"?"active-bag":b.dataset.t==="auction"?"active-auction":b.dataset.t==="last"?"active-last":b.dataset.t==="blitz"?"active-blitz":"active-normal");
      if (blitzSection) blitzSection.style.display = q.type === 'blitz' ? '' : 'none';
      if (timerSection) timerSection.style.display = (q.type === 'blitz' || q.type === 'last') ? '' : 'none';
    };
  });
  top.querySelector(".btn-ghost[style*=red]").onclick = () => { pack.categories[ci].questions.splice(qi,1); renderCategories(container); };
  card.appendChild(top);

  // Question text
  const ta = document.createElement("textarea");
  ta.rows=3; ta.placeholder="Текст вопроса (заголовок блица или текст обычного вопроса)"; ta.textContent=q.question||"";
  ta.oninput = e => { q.question=e.target.value; };
  card.appendChild(ta);

  // Blitz sub-questions section
  blitzSection = buildBlitzSection(q);
  blitzSection.style.display = q.type === 'blitz' ? '' : 'none';
  card.appendChild(blitzSection);

  // Timer-on-buzz section (blitz + last)
  timerSection = document.createElement('div');
  timerSection.className = 'blitz-section';
  timerSection.style.display = (q.type === 'blitz' || q.type === 'last') ? '' : 'none';
  const timerLabel = document.createElement('label');
  timerLabel.style.cssText = 'display:flex;align-items:center;gap:.4rem;cursor:pointer;font-size:.82rem';
  const timerCb = document.createElement('input');
  timerCb.type = 'checkbox'; timerCb.checked = !!q.buzz_pauses_timer;
  timerCb.onchange = () => { q.buzz_pauses_timer = timerCb.checked; };
  timerLabel.appendChild(timerCb);
  timerLabel.appendChild(document.createTextNode('Таймер останавливается при ответе команды'));
  timerSection.appendChild(timerLabel);
  card.appendChild(timerSection);

  // Media fields
  card.appendChild(buildMediaSection(q, ["image","audio","video"]));

  // Reveal toggle
  const revToggle = document.createElement("button");
  revToggle.className="reveal-toggle";
  revToggle.textContent = q.answer_reveal ? "▲ Скрыть блок ответа" : "▼ Добавить ответ/пояснение";
  card.appendChild(revToggle);

  const revBlock = document.createElement("div");
  revBlock.className="reveal-block";
  revBlock.style.display = q.answer_reveal ? "" : "none";
  if (!q.answer_reveal) q.answer_reveal=null;

  const revTa = document.createElement("textarea");
  revTa.rows=2; revTa.placeholder="Текст ответа/пояснения";
  revTa.textContent=(q.answer_reveal||{}).text||"";
  revTa.oninput=e=>{ if(!q.answer_reveal)q.answer_reveal={}; q.answer_reveal.text=e.target.value; };
  const revLabel=document.createElement("strong");
  revLabel.style.cssText="font-size:.82rem;color:var(--text-muted)";
  revLabel.textContent="Ответ / пояснение (показывается после ответа или аннуляции)";
  revBlock.appendChild(revLabel);
  revBlock.appendChild(revTa);
  if(!q.answer_reveal) q.answer_reveal={text:"",image:null,audio:null,video:null};
  revBlock.appendChild(buildMediaSection(q.answer_reveal, ["image","audio","video"]));
  card.appendChild(revBlock);

  revToggle.onclick = () => {
    const hidden = revBlock.style.display==="none";
    revBlock.style.display = hidden?"":"none";
    revToggle.textContent = hidden?"▲ Скрыть блок ответа":"▼ Добавить ответ/пояснение";
    if(!hidden){ q.answer_reveal=null; }
    else if(!q.answer_reveal){ q.answer_reveal={text:"",image:null,audio:null,video:null}; }
  };

  return card;
}

function buildMediaSection(obj, fields) {
  const wrap = document.createElement("div");
  wrap.className="media-picker";
  const labels = {image:"Картинка",audio:"Аудио",video:"Видео"};
  fields.forEach(field => {
    const row = document.createElement("div");
    row.className="media-picker-row";

    const lbl = document.createElement("label");
    lbl.textContent=labels[field];

    const pickBtn = document.createElement("button");
    pickBtn.className="pick-btn";
    pickBtn.textContent = obj[field] ? "Заменить" : "Выбрать файл…";

    const fname = document.createElement("span");
    fname.className="media-filename";
    fname.textContent = obj[field] ? "✓ файл загружен" : "";

    const clearBtn = document.createElement("button");
    clearBtn.className="media-clear"; clearBtn.textContent="✕";
    clearBtn.style.display = obj[field]?"inline":"none";
    clearBtn.title="Удалить файл";

    row.appendChild(lbl); row.appendChild(pickBtn); row.appendChild(fname); row.appendChild(clearBtn);
    wrap.appendChild(row);

    // Preview for images
    let previewEl = null;
    if(field==="image" && obj[field]){
      previewEl = document.createElement("img");
      previewEl.className="media-preview-img"; previewEl.src=obj[field];
      wrap.appendChild(previewEl);
    }

    pickBtn.onclick = () => {
      pickFile(mimeToAccept(field), async file => {
        const dataUrl = await fileToDataURL(file);
        obj[field] = dataUrl;
        fname.textContent = "✓ "+file.name;
        pickBtn.textContent = "Заменить";
        clearBtn.style.display="inline";
        if(field==="image"){
          if(!previewEl){ previewEl=document.createElement("img"); previewEl.className="media-preview-img"; wrap.appendChild(previewEl); }
          previewEl.src=dataUrl;
        }
      });
    };

    clearBtn.onclick = () => {
      obj[field]=null; fname.textContent=""; pickBtn.textContent="Выбрать файл…"; clearBtn.style.display="none";
      if(previewEl){ previewEl.remove(); previewEl=null; }
    };
  });
  return wrap;
}

function buildBlitzSection(q) {
  if (!q.sub_questions) q.sub_questions = [];
  const wrap = document.createElement('div');
  wrap.className = 'blitz-section';
  const hdr = document.createElement('div');
  hdr.style.cssText = 'font-size:.82rem;color:var(--text-muted);font-weight:600';
  hdr.textContent = '⚡ Подвопросы блица:';
  wrap.appendChild(hdr);
  const autoSkipLabel = document.createElement('label');
  autoSkipLabel.style.cssText = 'display:flex;align-items:center;gap:.4rem;cursor:pointer;font-size:.82rem;margin:.2rem 0 .4rem';
  const autoSkipCb = document.createElement('input');
  autoSkipCb.type = 'checkbox'; autoSkipCb.checked = !!q.blitz_auto_skip;
  autoSkipCb.onchange = () => { q.blitz_auto_skip = autoSkipCb.checked; };
  autoSkipLabel.appendChild(autoSkipCb);
  autoSkipLabel.appendChild(document.createTextNode('Автопропуск при неверном ответе'));
  wrap.appendChild(autoSkipLabel);
  const list = document.createElement('div');
  list.className = 'blitz-list';
  wrap.appendChild(list);
  function renderSubs() {
    list.innerHTML = '';
    q.sub_questions.forEach((sub, si) => {
      const row = document.createElement('div');
      row.className = 'blitz-sub-row';
      const num = document.createElement('span');
      num.className = 'blitz-sub-num'; num.textContent = (si+1)+'.';
      const qta = document.createElement('textarea');
      qta.className = 'blitz-sub-q'; qta.rows=2; qta.placeholder='Текст подвопроса';
      qta.value = sub.question||''; qta.oninput = e => { sub.question=e.target.value; };
      const ans = document.createElement('input');
      ans.type='text'; ans.className='blitz-sub-a'; ans.placeholder='Ответ (для ведущего)';
      ans.value=sub.answer||''; ans.oninput=e=>{ sub.answer=e.target.value; };
      const del = document.createElement('button');
      del.className='media-clear'; del.textContent='✕'; del.title='Удалить';
      del.onclick=()=>{ q.sub_questions.splice(si,1); renderSubs(); };
      row.appendChild(num); row.appendChild(qta); row.appendChild(ans); row.appendChild(del);
      list.appendChild(row);
    });
  }
  renderSubs();
  const addBtn = document.createElement('button');
  addBtn.className='btn btn-ghost btn-sm'; addBtn.style.marginTop='.3rem';
  addBtn.textContent='+ Подвопрос';
  addBtn.onclick=()=>{ q.sub_questions.push({question:'',answer:''}); renderSubs(); };
  wrap.appendChild(addBtn);
  return wrap;
}

function downloadPack() {
  if (!pack) return;
  const name = (pack.name||'pack').replace(/[^\wа-яёА-ЯЁ\s\-]/gi,'_');
  const blob = new Blob([JSON.stringify(pack,null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name+'.json'; a.click();
  try {
    localStorage.setItem('qhb_pack_'+name, JSON.stringify(pack));
    const names = JSON.parse(localStorage.getItem('qhb_pack_names')||'[]');
    if (!names.includes(name)) { names.push(name); localStorage.setItem('qhb_pack_names', JSON.stringify(names)); }
  } catch {}
}

function esc(s){ return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
</script>
